# Builds the KeyDebounce app (with the daemon compiled from keydebounce.c inside it)
# and uploads it as a downloadable artifact on the run's summary page.
# Run it by hand (Actions -> Build app -> Run workflow) with a release tag to also
# publish a GitHub release with the APK attached.
name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag, for example v1.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The daemon is built with the same NDK as the manual build in CLAUDE.md.
      - name: Install NDK 27.0.12077973
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check the daemon inside the APK
        run: |
          unzip -o app/build/outputs/apk/debug/keydebounce-debug.apk 'assets/kd/*' -d apk
          ls -la apk/assets/kd
          file apk/assets/kd/keydebounce
          file apk/assets/kd/keydebounce | grep -q 'ELF 32-bit LSB .*ARM'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keydebounce-apk
          path: app/build/outputs/apk/debug/keydebounce-debug.apk
          if-no-files-found: error

      # The same daemon binary and install scripts, for installing by hand with adb.
      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: keydebounce-daemon
          path: apk/assets/kd/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keydebounce-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: keydebounce-daemon
          path: daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Tag must look like v1.0"; exit 1; }
          mkdir dist
          cp apk/keydebounce-debug.apk "dist/keydebounce-$TAG.apk"
          (cd daemon && zip -r "../dist/keydebounce-daemon-$TAG.zip" .)
          cat > notes.md <<'EOF'
          > [!CAUTION]
          > **Use at your own risk.** The permanent install changes the phone's SELinux policy and other low-level parts, and can leave it unable to boot. The developers take no responsibility for damage or data loss. This comes with no warranty (GPL-3.0, sections 15 and 16). Read the warning in the README first.

          > [!WARNING]
          > **Only built and tested on the Verizon XP3800 variant.** Install now refuses to proceed if this device's compiled stock policy doesn't match its own `precompiled_sepolicy` — a real check, but not a guarantee on every possible variant difference. See the README.

          For the **Sonim XP3800 on Android 8.1** only.

          ## What's new in 2.0 (since v1.5)
          - **New package name: `com.anonymousfliphones.keydebounce`.** Android treats it as a different app, so uninstall the old one first: `adb uninstall io.github.anonymousfliphones.keydebounce`. The permanent install on /system isn't affected.
          - **Root Manager support.** With Root Manager, the first root request after each restart runs its exploit, which can crash the phone. The app now tells you when root hasn't started yet and offers **Start root** instead of crashing the phone unasked.
          - **Start at boot works with Root Manager.** It waits until about 5 minutes after power-on, when the phone has calmed down, then starts root and the filter. If that ever crashes the phone, the next restarts ask first until a start works. With Magisk it starts right away.
          - **Boot notification** (optional): a silent notification when Start at boot starts the filter.
          - **Install and Undo** no longer report a false "failed", and **Check install** verifies an install. **Restart** runs in the background.
          - **Log access with root:** the app can grant itself the correction log's permission (**Grant with root**).
          - **Bounce filter (no root)** works: turn it on in Settings ▸ Accessibility ▸ KeyDebounce, or with the command shown in the app.
          - The D-pad reaches every button, the root mode buttons fit the screen, and every option's text just explains what it does.

          ## Files
          - `keydebounce-*.apk`: the app. Install it with `adb install`. It's signed with a debug key, so uninstall any older build first.
          - `keydebounce-daemon-*.zip`: the daemon binary and install scripts, for installing by hand.

          Setup, root mode and the one-time `READ_LOGS` grant for the correction log are covered in the README.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "KeyDebounce $TAG" --notes-file notes.md
